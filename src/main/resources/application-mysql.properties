# ===================================================================
# TalentFlow Enterprise Recruitment Platform - MySQL Profile
# Activate via: --spring.profiles.active=mysql
# Or in application.properties: spring.profiles.active=mysql
# ===================================================================

# MySQL Datasource (Connects to local MySQL Server 8.0)
spring.datasource.url=jdbc:mysql://localhost:3306/talentflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate JPA with MySQL 8 Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console when running in MySQL mode
spring.h2.console.enabled=false
