# ===================================================================
# TalentFlow Enterprise Recruitment Platform - Backend Configuration
# Default Profile: SQL Database (H2 file-persistent / in-memory)
# ===================================================================

spring.application.name=talentflow-backend
server.port=8080

# -------------------------------------------------------------------
# SQL Database (Default: Embedded & persistent H2 file)
# To switch to MySQL, set spring.profiles.active=mysql (see below)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/talentflowdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate SQL Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.talentflow.backend=INFO
logging.level.org.hibernate.SQL=DEBUG
